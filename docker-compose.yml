version: "9.0.1-1.el9"

services:
  mysqldb:
    image: mysql:latest

    networks:
      - springmysql-net
    environment:
      - MYSQL_ROOT_PASSWORD=Rahul@1234
      - MYSQL_DATABASE=psygenie

  spring-backend:
    image: spring-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - spring.datasource.url=jdbc:mysql://host.docker.internal:3306/psygenie?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Europe/Paris
    networks:
      - springmysql-net
    depends_on:
      - mysqldb

networks:
  springmysql-net: